<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#141a26"/>
  <!-- A timeline with the moment you are viewing picked out. Deliberately TWO elements,
       not four: at a true 16px the earlier three-dot version merged into one blob. -->
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#4fc3f7" stroke-width="2.6"
        stroke-linecap="round" opacity=".45"/>
  <circle cx="20" cy="16" r="5" fill="#4fc3f7"/>
</svg>
