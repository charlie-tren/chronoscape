# Build the static site and publish it to the Pages project that the custom domain
# actually points at.
#
# WHY THIS EXISTS: chronoscape.charlietrenorden.com is served by `chronoscape-timeline`,
# a DIRECT-UPLOAD Pages project, which does not rebuild when this repo is pushed. The
# Git-connected project (`chronoscape-8m5.pages.dev`) does rebuild, but has no custom
# domain - so for months the live site has lagged the repo. On 11/08/2026 the domain was
# on v3.51 while the repo was on v3.54. Every fix silently missed visitors.
#
# This closes that gap without touching the Cloudflare dashboard. See TODO.md - moving the
# custom domain onto the Git-connected project is the tidier long-term fix, and would make
# this workflow redundant.
#
# 16/08/2026: the Cloudflare half has never actually run, because CLOUDFLARE_API_TOKEN was
# never set, so the domain has kept serving a stale build while every run reported success.
# Rather than leave the site unpublishable, this workflow now ALSO deploys to GitHub Pages,
# which needs no credentials at all: a project repo owned by charlie-tren is served under
# the user site's custom domain automatically, so this lands at
# charlietrenorden.com/chronoscape/ - exactly how consensus-drift and lindy-effect already
# work. The Cloudflare step is kept and still self-skips, so if the token is ever set both
# targets stay in step.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # version() reads git history and has already shipped a production bug on
          # Cloudflare's shallow clone - give it the full history here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This repo's file is requirements-build.txt; the default cache glob only looks
          # for requirements.txt / pyproject.toml and hard-fails the step if it finds none.
          cache-dependency-path: requirements-build.txt

      - run: pip install -r requirements-build.txt pytest

      # Guards the code. validate.py (below) guards the data; these guard the maths
      # that positions dots and the version() shallow-clone branch, both of which
      # have shipped bugs before. A failure here stops the deploy.
      - name: Tests
        run: python -m pytest tests -q

      # validate.py runs inside build.py, so a malformed country fails here rather than
      # shipping.
      # SITE_URL is the canonical origin baked into <link rel=canonical>, og:url and the
      # sitemap. It points at the GitHub Pages path, because that is the copy that is
      # actually current - the Cloudflare subdomain serves a stale build nobody can update
      # without the token.
      - run: python site/build.py
        env:
          SITE_URL: https://charlietrenorden.com/chronoscape

      - name: Publish to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: pages
        uses: actions/deploy-pages@v4

      - name: Check the deploy credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"

          # Quantify the damage rather than just saying "not deployed". Drift only
          # happens on a push that is not published, which is exactly here - so an
          # on-push check is sufficient and there is no need for a cron.
          BUILT=$(grep -oE 'v3\.[0-9]+' site/dist/index.html | head -1)
          LIVE=$(curl -s --max-time 20 https://chronoscape.charlietrenorden.com/ \
                 | grep -oE 'v3\.[0-9]+' | head -1)
          BEHIND=""
          if [ -n "$BUILT" ] && [ -n "$LIVE" ]; then
            B=${BUILT#v3.}; L=${LIVE#v3.}
            if [ "$B" -gt "$L" ] 2>/dev/null; then BEHIND=" - the live domain is $((B - L)) version(s) behind"; fi
          fi
          echo "::warning title=Not deployed::Built ${BUILT:-?}, live is ${LIVE:-unknown}${BEHIND}. \
          The site built fine but was NOT published. Add the CLOUDFLARE_API_TOKEN repo secret \
          (Cloudflare Pages: Edit) to publish automatically - CLOUDFLARE_ACCOUNT_ID is already set. \
          Until then publish by hand: python site/build.py && npx wrangler pages deploy site/dist \
          --project-name chronoscape-timeline. See TODO.md."

      # Deliberately NOT a silent skip: the step above writes a visible warning annotation
      # when the secrets are missing, so a green tick can never be mistaken for "published".
      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site/dist \
            --project-name chronoscape-timeline \
            --branch master

      - name: Confirm what the live domain is actually serving
        if: steps.creds.outputs.ready == 'true'
        run: |
          sleep 20
          echo "Live version footer:"
          curl -s https://chronoscape.charlietrenorden.com/ | grep -oE 'v3\.[0-9]+' | head -1
          echo "Built version footer:"
          grep -oE 'v3\.[0-9]+' site/dist/index.html | head -1
